# PROPOSED GitHub Actions workflow. Copy to .github/workflows/ci.yml (the bot token lacks the `workflow` scope to push it).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Paper only in CI; no real secrets are ever needed.
      TRADING_MODE: paper
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - name: Unit tests
        run: npx vitest run --exclude 'src/test/db/**'
      - name: DB tests (real Postgres via PGlite, no Docker)
        run: npm run test:db
      - name: Build (dummy public env, no secrets)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

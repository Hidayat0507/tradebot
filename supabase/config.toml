# Dedicated local stack. No hosted project is linked or required.
project_id = "tradebot-codex-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
jwt_secret = "env(TRADEBOT_LOCAL_JWT_SECRET)"
anon_key = "env(TRADEBOT_LOCAL_ANON_KEY)"
service_role_key = "env(TRADEBOT_LOCAL_SERVICE_ROLE_KEY)"
publishable_key = "env(TRADEBOT_LOCAL_PUBLISHABLE_KEY)"
secret_key = "env(TRADEBOT_LOCAL_SECRET_KEY)"
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = ["http://localhost:3100"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

# The app uses Auth and PostgREST; keep unused local services off.
[realtime]
enabled = false

[storage]
enabled = false
